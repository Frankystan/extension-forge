<mat-toolbar color="primary">
  <span>ForgeNotes — Opciones</span>
</mat-toolbar>

<div class="content">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Preferencias</mat-card-title>
      <mat-card-subtitle>Se guardan en chrome.storage.local y se reflejan en las demás superficies.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Tema:</p>
      <mat-button-toggle-group [(ngModel)]="theme">
        <mat-button-toggle value="light">Claro</mat-button-toggle>
        <mat-button-toggle value="dark">Oscuro</mat-button-toggle>
      </mat-button-toggle-group>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Máximo de notas</mat-label>
        <input matInput type="number" [(ngModel)]="maxNotes" />
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="save()">Guardar</button>
      <button mat-button color="warn" (click)="service.clearAll()">Borrar todas las notas</button>
    </mat-card-actions>
  </mat-card>
</div>
